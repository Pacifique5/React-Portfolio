<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="briefcaseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Briefcase body -->
  <rect x="15" y="35" width="70" height="45" rx="5" fill="url(#briefcaseGradient)"/>
  
  <!-- Briefcase top -->
  <rect x="30" y="25" width="40" height="15" rx="3" fill="#764ba2"/>
  
  <!-- Handle -->
  <path d="M 40 25 Q 50 15 60 25" stroke="#667eea" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Lock -->
  <rect x="47" y="50" width="6" height="8" rx="1" fill="#f093fb"/>
  <circle cx="50" cy="54" r="2" fill="#ffffff"/>
  
  <!-- Shine effect -->
  <ellipse cx="35" cy="45" rx="8" ry="12" fill="rgba(255,255,255,0.2)"/>
</svg>
